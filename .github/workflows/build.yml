# Build workflow for the Android app (Kotlin + Jetpack Compose, Gradle Kotlin DSL).
# Always assembles the debug APK; the release APK/AAB are built and uploaded
# only when signing secrets are configured.

name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # KEYSTORE_PATH intentionally not set: app/build.gradle.kts defaults the
      # keystore path to <rootDir>/my-upload-key.jks, which is where the
      # "Decode upload keystore" step writes it. file() in Gradle would
      # otherwise resolve the relative path against the app/ module dir.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Decode upload keystore
        if: env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' && env.KEYSTORE_BASE64 != ''
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks

      - name: Build release APK and AAB
        if: env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' && env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release artifacts
        if: env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' && env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error